name: Deploy scenes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --run
        env:
          CI: "true"

      - run: npm run build

      - name: Stage site
        run: |
          # Layout (https://alexmj212.dev/stream-animations/):
          #   v/<commit>/<scene>/   this deploy's build, never changed after
          #   latest/<scene>/       same build, the loader's offline fallback
          #   <scene>/              loader OBS points at (tools/pages/loader.html)
          #   index.html            loader for epcot (the site's old root URL)
          #   version.json          which deploy is live
          # Keyed by commit, not version: every merge deploys, and a fix
          # between releases must get a new URL too.
          version=$(node -p "require('./package.json').version")
          build=${GITHUB_SHA:0:7}
          mkdir -p _site
          for scene in stinger sidebar shade background epcot; do
            # find: vite can nest the output path under dist/<scene>/
            src=$(find "dist/$scene" -name index.html | head -n 1)
            test -s "$src"
            for dir in "v/$build" latest; do
              mkdir -p "_site/$dir/$scene"
              cp "$src" "_site/$dir/$scene/index.html"
            done
            mkdir -p "_site/$scene"
            sed -e "s|__SCENE__|$scene|" -e "s|__ROOT__|../|" tools/pages/loader.html > "_site/$scene/index.html"
          done
          sed -e "s|__SCENE__|epcot|" -e "s|__ROOT__|./|" tools/pages/loader.html > _site/index.html
          printf '{"version":"%s","commit":"%s","build":"%s"}\n' "$version" "$GITHUB_SHA" "$build" > _site/version.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
