name: Deploy scenes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # A hung step otherwise holds the deploy (and every later one, through
    # the concurrency group) for GitHub's 6 h default (v2.17.0, 2026-11-11).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --run
        env:
          CI: "true"

      # AJ (2026-10-29): "no audio clipping ever". With motion.yml manual
      # since 2026-11-10, this is the one place the rule is enforced
      # (docs/AUDIO.md, "Levels and clipping"). About 4 s.
      # The check takes seconds; getting ffmpeg is what can stall. On
      # 2026-11-11 the runners could not resolve the Ubuntu archive at all
      # (the v2.17.0 and v2.18.0 deploys hung), so apt gets 2 minutes, then
      # we fall back to the static ffmpeg 7.0.2 inside the imageio-ffmpeg
      # 0.6.0 wheel from PyPI, pinned by sha256 because this job deploys.
      # man-db's trigger is skipped as it is slow on runners.
      - name: Audio levels
        timeout-minutes: 8
        env:
          FFMPEG_WHEEL: https://files.pythonhosted.org/packages/a0/2d/43c8522a2038e9d0e7dbdf3a61195ecc31ca576fb1527a528c877e87d973/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl
          FFMPEG_WHEEL_SHA256: c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282
        run: |
          if ! command -v ffmpeg; then
            sudo rm -f /var/lib/man-db/auto-update
            timeout 120 sh -c 'sudo apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=1 update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=30 install -y -q --no-install-recommends ffmpeg' || echo "apt could not install ffmpeg"
          fi
          if ! command -v ffmpeg; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.whl" "$FFMPEG_WHEEL"
            echo "$FFMPEG_WHEEL_SHA256  $RUNNER_TEMP/ffmpeg.whl" | sha256sum -c
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            unzip -q -j "$RUNNER_TEMP/ffmpeg.whl" 'imageio_ffmpeg/binaries/ffmpeg-linux-x86_64-*' -d "$RUNNER_TEMP/ffmpeg"
            mv "$RUNNER_TEMP"/ffmpeg/ffmpeg-linux-x86_64-* "$RUNNER_TEMP/ffmpeg/ffmpeg"
            chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg"
            export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          fi
          ffmpeg -version | head -1
          npm run audio -- assets

      - run: npm run build

      - name: Stage site
        # Layout and version.json: see tools/pages/stage.sh
        run: bash tools/pages/stage.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

  # After every deploy: smoke the live pages, then tag and publish any
  # release commit that has no tag yet (tools/release/publish.sh). This
  # replaced the Defiant hand-off for smoke and tags (AJ, 2026-10-29).
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No stored credentials: npm ci runs install scripts, and this job's
      # token can write. gh gets the token only in the publish step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The CDN can serve the old build for a minute or two after a deploy,
      # so retry before calling it a failure.
      - name: Smoke the live pages
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run pages:smoke -- https://alexmj212.dev/stream-animations "$GITHUB_SHA"; then
              exit 0
            fi
            echo "Smoke attempt $attempt failed; retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Tag and publish releases
        run: bash tools/release/publish.sh
        env:
          GH_TOKEN: ${{ github.token }}
