name: Deploy scenes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --run
        env:
          CI: "true"

      - run: npm run build

      - name: Stage site
        run: |
          mkdir -p _site
          # Each scene builds to one self-contained HTML file. Epcot stays at
          # the site root (its existing URL); every scene is also served at
          # /<scene>/ so OBS browser sources can load them from Pages.
          for scene in stinger sidebar shade background epcot; do
            mkdir -p "_site/$scene"
            # find: vite can nest the output path under dist/<scene>/
            src=$(find "dist/$scene" -name index.html | head -n 1)
            test -s "$src"
            cp "$src" "_site/$scene/index.html"
          done
          cp _site/epcot/index.html _site/index.html
          # What's live, for checking a deploy: version and commit.
          printf '%s %s\n' "$(node -p "require('./package.json').version")" "$GITHUB_SHA" > _site/version.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
