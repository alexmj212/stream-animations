<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            position: relative;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #backgroundCanvas {
            z-index: 1;
        }

        #foregroundCanvas {
            z-index: 2;
        }
    </style>
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <canvas id="foregroundCanvas"></canvas>

    <script type="module">
        import { getColorFromURL, hexToHSL } from '../shared/colors.js';
        import { setupCanvas, clearCanvas } from '../shared/canvas.js';
        import { BackgroundBar } from './BackgroundBar.js';
        import { PerformanceMonitor } from '../shared/performance.js';
        import { DeltaTimer } from '../shared/timing.js';
        import { AnimationLifecycle } from '../shared/lifecycle.js';
        import { config } from '../config/config.js';

        // Get parameters from URL with config defaults
        const urlParams = new URLSearchParams(window.location.search);
        const speedMultiplier = parseFloat(urlParams.get('speed')) || config.background.speed.defaultMultiplier;
        const barDensity = parseInt(urlParams.get('density')) || config.background.density.default;
        const showPerf = urlParams.get('perf') === 'true';
        const baseColor = getColorFromURL();
        const baseHSL = hexToHSL(baseColor);

        // Setup performance monitoring
        const perfMonitor = new PerformanceMonitor(60);
        if (showPerf) {
            perfMonitor.enable();
            // Log performance stats every 2 seconds
            setInterval(() => perfMonitor.logStats(), 2000);
        }

        // Canvas setup - layered approach for better performance
        const backgroundCanvas = document.getElementById('backgroundCanvas');
        const foregroundCanvas = document.getElementById('foregroundCanvas');
        const bgCtx = setupCanvas(backgroundCanvas);
        const fgCtx = setupCanvas(foregroundCanvas);

        // Initialize delta-time system
        const deltaTimer = new DeltaTimer();

        // Initialize lifecycle management
        const lifecycle = new AnimationLifecycle();

        // Setup cleanup for cache and animation
        lifecycle.onCleanup(() => {
            if (BackgroundBar.cacheCleanupInterval) {
                clearInterval(BackgroundBar.cacheCleanupInterval);
                BackgroundBar.cacheCleanupInterval = null;
            }
            console.log('[Background] Cleanup complete');
        });

        // Create bars with random types - split into slow and fast layers
        const backgroundBars = []; // Slower moving bars
        const foregroundBars = []; // Faster moving bars

        for (let i = 0; i < barDensity; i++) {
            const type = Math.random() > 0.6 ? 'slanted' : 'horizontal';
            const speed = 0.1 + Math.random() * 0.9;

            // Put slower bars (speed < 0.5) on background layer, faster on foreground
            if (speed < 0.5) {
                const bar = new BackgroundBar(bgCtx, backgroundCanvas, type, baseHSL, speedMultiplier * speed);
                bar.zIndex = Math.random();
                backgroundBars.push(bar);
            } else {
                const bar = new BackgroundBar(fgCtx, foregroundCanvas, type, baseHSL, speedMultiplier * speed);
                bar.zIndex = Math.random();
                foregroundBars.push(bar);
            }
        }

        // Function to add a new bar when one is removed
        function addNewBar(layer) {
            const type = Math.random() > 0.6 ? 'slanted' : 'horizontal';
            const speed = 0.1 + Math.random() * 0.9;

            if (layer === 'background') {
                const bar = new BackgroundBar(bgCtx, backgroundCanvas, type, baseHSL, speedMultiplier * speed, false);
                bar.zIndex = Math.random();
                backgroundBars.push(bar);
            } else {
                const bar = new BackgroundBar(fgCtx, foregroundCanvas, type, baseHSL, speedMultiplier * speed, false);
                bar.zIndex = Math.random();
                foregroundBars.push(bar);
            }
        }

        // Track if bars need re-sorting
        let bgNeedsSort = true;
        let fgNeedsSort = true;

        // Animation loop with delta-time
        function animate(timestamp) {
            perfMonitor.recordFrame();

            // Calculate delta-time in seconds
            const deltaTime = deltaTimer.update(timestamp);

            // Update and render background layer (now at full 60fps, not 30fps)
            clearCanvas(bgCtx, backgroundCanvas);

            // Remove inactive bars and add new ones
            const bgInitialCount = backgroundBars.length;
            for (let i = backgroundBars.length - 1; i >= 0; i--) {
                if (!backgroundBars[i].active) {
                    backgroundBars.splice(i, 1);
                    bgNeedsSort = true;
                }
            }

            const bgRemovedCount = bgInitialCount - backgroundBars.length;
            for (let i = 0; i < bgRemovedCount; i++) {
                addNewBar('background');
                bgNeedsSort = true;
            }

            if (bgNeedsSort) {
                backgroundBars.sort((a, b) => a.zIndex - b.zIndex);
                bgNeedsSort = false;
            }

            for (let i = 0; i < backgroundBars.length; i++) {
                backgroundBars[i].update(deltaTime);
                backgroundBars[i].draw();
            }

            // Update and render foreground layer
            clearCanvas(fgCtx, foregroundCanvas);

            // Remove inactive bars and add new ones
            const fgInitialCount = foregroundBars.length;
            for (let i = foregroundBars.length - 1; i >= 0; i--) {
                if (!foregroundBars[i].active) {
                    foregroundBars.splice(i, 1);
                    fgNeedsSort = true;
                }
            }

            const fgRemovedCount = fgInitialCount - foregroundBars.length;
            for (let i = 0; i < fgRemovedCount; i++) {
                addNewBar('foreground');
                fgNeedsSort = true;
            }

            if (fgNeedsSort) {
                foregroundBars.sort((a, b) => a.zIndex - b.zIndex);
                fgNeedsSort = false;
            }

            for (let i = 0; i < foregroundBars.length; i++) {
                foregroundBars[i].update(deltaTime);
                foregroundBars[i].draw();
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
