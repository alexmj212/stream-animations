<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shade Text Animation</title>
    <style>
      /* Load Jost font for text rendering - @import must be first */
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@700&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        position: relative;
        background: transparent;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script type="module">
      import { ShadeBar } from './ShadeBar.js';
      import { CurtainBar } from './CurtainBar.js';
      import { config } from '../config/config.js';
      import { setupCanvas, clearCanvas } from '../shared/canvas.js';
      import { DeltaTimer } from '../shared/timing.js';
      import { AnimationLifecycle } from '../shared/lifecycle.js';
      import { getColorFromURL, hexToHSL } from '../shared/colors.js';
      import { PerformanceMonitor } from '../shared/performance.js';
      import { PerformanceStorage } from '../shared/perfStorage.js';
      import { PerformanceOverlay } from '../shared/perfOverlay.js';
      import { DirtyRectTracker } from '../shared/dirtyRect.js';
      import { registerProbe } from '../shared/motion.js';

      // Get parameters from URL
      const urlParams = new URLSearchParams(window.location.search);
      const text = (urlParams.get('text') || 'Default Text').toUpperCase();
      const durationParam = urlParams.get('duration');
      const holdDurationMs = durationParam ? parseInt(durationParam) : null; // null triggers calculation
      const showPerf = urlParams.get('perf') === 'true';
      const baseColor = getColorFromURL();
      const baseHSL = hexToHSL(baseColor);

      // Setup performance monitoring
      const perfMonitor = new PerformanceMonitor(60, 60);
      let perfOverlay = null;

      if (showPerf) {
        const perfStorage = new PerformanceStorage(50);
        perfOverlay = new PerformanceOverlay(perfMonitor, perfStorage, {
          position: 'top-right',
          opacity: 0.9,
          scene: 'shade'
        });

        perfMonitor.enable();
        perfOverlay.setupHotkey();
        perfOverlay.startSession();
        perfOverlay.show();
        perfOverlay.exposeAPI();
      }

      // Canvas setup
      const canvas = document.getElementById('canvas');
      const ctx = setupCanvas(canvas, { alpha: true });

      // Initialize dirty rectangle tracker (if enabled)
      const dirtyRectanglesEnabled = config.performance.dirtyRectangles.enabled;
      const visualize = config.performance.dirtyRectangles.visualize && showPerf; // Only visualize in perf mode

      let dirtyTracker = null;
      if (dirtyRectanglesEnabled) {
        dirtyTracker = new DirtyRectTracker(
          config.performance.dirtyRectangles.safetyMargin,
          visualize
        );
        dirtyTracker.setCanvas(canvas, ctx);
      }

      // Initialize delta-time and lifecycle
      const deltaTimer = new DeltaTimer();
      const lifecycle = new AnimationLifecycle();

      lifecycle.onCleanup(() => {
        // Cleanup any cache intervals if components use them
        if (ShadeBar.cacheCleanupInterval) {
          clearInterval(ShadeBar.cacheCleanupInterval);
          ShadeBar.cacheCleanupInterval = null;
        }
        if (CurtainBar.cacheCleanupInterval) {
          clearInterval(CurtainBar.cacheCleanupInterval);
          CurtainBar.cacheCleanupInterval = null;
        }
        console.log('[Shade] Cleanup complete');
      });

      // Create components array (following stinger/sidebar/background pattern)
      const components = [];

      // Save session on page unload
      window.addEventListener('beforeunload', () => {
        if (showPerf && perfOverlay) {
          perfOverlay.endSession();
        }
      });

      // Wait for fonts to load before initializing (RESEARCH.md Pitfall 1: Font Loading)
      document.fonts.ready.then(async () => {
        console.log('[Shade] Fonts loaded, initializing components');

        // Calculate shared timing (single source of truth - RESEARCH.md Pitfall 3)
        // Hold duration calculated from text length (ShadeBar pattern)
        const calculatedHoldMs = holdDurationMs !== null
          ? holdDurationMs
          : ShadeBar.calculateHoldDuration(text);

        // Total duration = enter + hold + exit (all components must share this)
        const totalDurationMs = config.shade.durations.entryMs + calculatedHoldMs + config.shade.durations.exitMs;

        console.log('[Shade] Text:', text);
        console.log('[Shade] Color:', baseColor);
        console.log('[Shade] Hold Duration:', calculatedHoldMs, 'ms');
        console.log('[Shade] Total Duration:', totalDurationMs, 'ms');

        // Extract font size for curtain tip sizing (96px from config)
        const fontSize = 96; // From config.shade.text.font: 'bold 96px Jost'

        // Create curtains with shared total duration and text height for tip sizing
        const topCurtain = new CurtainBar(ctx, canvas, 'top', baseHSL, totalDurationMs, { textHeight: fontSize });
        const bottomCurtain = new CurtainBar(ctx, canvas, 'bottom', baseHSL, totalDurationMs, { textHeight: fontSize });

        // Create ShadeBar instance (text is always white - no color parameter)
        const shadeBar = new ShadeBar(ctx, canvas, text, calculatedHoldMs);

        // Initialize text metrics after fonts are ready (now async)
        await shadeBar.init();

        console.log('[Shade] Text Width:', shadeBar.textWidth, 'px');

        // Add components to array (following stinger/sidebar/background pattern)
        components.push(topCurtain, bottomCurtain, shadeBar);

        registerProbe('shade', () => [
          ...[topCurtain, bottomCurtain].filter(c => c.active).map(c => ({ id: `curtain-${c.position}`, x: 0, y: c.y, phase: c.phase })),
          ...(shadeBar.active ? [{ id: 'text', x: shadeBar.x, y: shadeBar.y, onscreen: shadeBar.x < canvas.width && shadeBar.x + shadeBar.textWidth > 0 }] : [])
        ]);

        /**
         * Animation loop (following stinger/sidebar/background pattern)
         *
         * Three-phase animation (synchronized across all components):
         * - Enter phase: curtains enter, text flies in from right (1 second)
         * - Hold phase: curtains static, text scrolls continuously (dynamic duration)
         * - Exit phase: curtains exit, text flies out left (1 second)
         *
         * RENDERING ORDER CRITICAL (RESEARCH.md Pitfall 1):
         * - Curtains drawn first (background layer)
         * - Text drawn last (foreground layer - always visible on top)
         */
        function animate(timestamp) {
          if (showPerf) perfMonitor.recordFrame();

          const deltaTime = deltaTimer.update(timestamp);

          clearCanvas(ctx, canvas, dirtyTracker);

          let allComplete = true;

          // Update and draw all components in order
          for (let i = 0; i < components.length; i++) {
            components[i].update(deltaTime);

            // Report dirty region before drawing (if component has getBoundingBox)
            if (dirtyTracker && components[i].active && typeof components[i].getBoundingBox === 'function') {
              const bbox = components[i].getBoundingBox();
              dirtyTracker.addRegion(bbox.x, bbox.y, bbox.width, bbox.height);
            }

            components[i].draw();
            if (components[i].active) {
              allComplete = false;
            }
          }

          // Continue animation if any component is still active
          if (!allComplete) {
            requestAnimationFrame(animate);
          } else {
            console.log('[Shade] Animation complete');
          }
        }

        // Start animation loop
        requestAnimationFrame(animate);

        // PERF-01 validation: Measure baseline vs optimized text rendering
        window.perfValidation = {
          // Run full validation suite
          runAll() {
            console.log('=== Performance Validation (PERF-01) ===\n');

            const baseline = this.measureBaseline();
            const optimized = this.measureOptimized();
            const speedup = baseline / optimized;

            console.log(`\nSpeedup: ${speedup.toFixed(1)}x`);

            if (speedup >= 5.0) {
              console.log('✓ PERF-01 requirement MET (≥5x gain)');
            } else {
              console.warn(`⚠ PERF-01 requirement NOT met (need ≥5x, got ${speedup.toFixed(1)}x)`);
            }

            return { baseline, optimized, speedup };
          },

          // Measure baseline (fillText every frame)
          measureBaseline() {
            const iterations = 1000;
            const testText = shadeBar.text;

            ctx.font = config.shade.text.font;
            ctx.fillStyle = config.shade.text.color;
            ctx.shadowColor = config.shade.text.shadow.color;
            ctx.shadowBlur = config.shade.text.shadow.blur;
            ctx.shadowOffsetX = config.shade.text.shadow.offsetX;
            ctx.shadowOffsetY = config.shade.text.shadow.offsetY;

            const start = performance.now();
            for (let i = 0; i < iterations; i++) {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.fillText(testText, 100, 500);
            }
            const duration = performance.now() - start;
            const avg = duration / iterations;

            console.log(`Baseline (fillText): ${avg.toFixed(3)}ms per render`);
            return avg;
          },

          // Measure optimized (drawImage cached canvas)
          measureOptimized() {
            const iterations = 1000;

            const start = performance.now();
            for (let i = 0; i < iterations; i++) {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(shadeBar.textCanvas, 100, 450);
            }
            const duration = performance.now() - start;
            const avg = duration / iterations;

            console.log(`Optimized (drawImage): ${avg.toFixed(3)}ms per render`);
            return avg;
          }
        };

        console.log('[Shade] Performance validation available: window.perfValidation.runAll()');
      });
    </script>
  </body>
</html>
