<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shade Text Animation</title>
    <style>
      /* Load Jost font for text rendering - @import must be first */
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@700&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        position: relative;
        background: transparent;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script type="module">
      import { ShadeBar } from './ShadeBar.js';
      import { CurtainBar } from './CurtainBar.js';
      import { config } from '../config/config.js';
      import { DeltaTimer } from '../shared/timing.js';
      import { AnimationLifecycle } from '../shared/lifecycle.js';
      import { hexToHSL } from '../shared/colors.js';

      // Parse URL parameters (CONFIG-01: URL parameter configuration)
      const urlParams = new URLSearchParams(window.location.search);
      const text = urlParams.get('text') || 'Default Text';
      const colorParam = urlParams.get('color') || '7289DA'; // Default Discord blurple
      const durationParam = urlParams.get('duration');
      const holdDurationMs = durationParam ? parseInt(durationParam) : null; // null triggers calculation

      // Setup canvas
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: config.performance.alpha.background });
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Convert hex color to HSL for curtains
      const baseColor = colorParam.startsWith('#') ? colorParam : `#${colorParam}`;
      const baseHSL = hexToHSL(baseColor);

      // Initialize lifecycle manager (CONFIG-03: AnimationLifecycle cleanup)
      const lifecycle = new AnimationLifecycle();

      // Wait for fonts to load before initializing (RESEARCH.md Pitfall 1: Font Loading)
      // CONFIG-04: Font loading prevents measurement race conditions
      document.fonts.ready.then(() => {
        console.log('[Shade] Fonts loaded, initializing components');

        // Calculate shared timing (single source of truth - RESEARCH.md Pitfall 3)
        // Hold duration calculated from text length (ShadeBar pattern)
        const calculatedHoldMs = holdDurationMs !== null
          ? holdDurationMs
          : ShadeBar.calculateHoldDuration(text);

        // Total duration = enter + hold + exit (all components must share this)
        const totalDurationMs = config.shade.durations.entryMs + calculatedHoldMs + config.shade.durations.exitMs;

        console.log('[Shade] Text:', text);
        console.log('[Shade] Color:', baseColor);
        console.log('[Shade] Hold Duration:', calculatedHoldMs, 'ms');
        console.log('[Shade] Total Duration:', totalDurationMs, 'ms');

        // Create curtains with shared total duration
        const topCurtain = new CurtainBar(ctx, canvas, 'top', baseHSL, totalDurationMs);
        const bottomCurtain = new CurtainBar(ctx, canvas, 'bottom', baseHSL, totalDurationMs);

        // Create ShadeBar instance (text is always white - no color parameter)
        const shadeBar = new ShadeBar(ctx, canvas, text, calculatedHoldMs);

        // Initialize text metrics after fonts are ready
        shadeBar.init();

        console.log('[Shade] Text Width:', shadeBar.textWidth, 'px');

        // Initialize delta-time timer (CONFIG-05: Frame-rate independence)
        const deltaTimer = new DeltaTimer();

        /**
         * Animation loop
         *
         * Three-phase animation (synchronized across all components):
         * - Enter phase: curtains enter, text flies in from right (1 second)
         * - Hold phase: curtains static, text scrolls continuously (dynamic duration)
         * - Exit phase: curtains exit, text flies out left (1 second)
         *
         * RENDERING ORDER CRITICAL (RESEARCH.md Pitfall 1):
         * - Curtains drawn first (background layer)
         * - Text drawn last (foreground layer - always visible on top)
         */
        function animate(timestamp) {
          const deltaTime = deltaTimer.update(timestamp);

          // Clear canvas
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Update all components with same deltaTime (synchronized)
          topCurtain.update(deltaTime);
          bottomCurtain.update(deltaTime);
          shadeBar.update(deltaTime);

          // RENDERING ORDER CRITICAL
          // Draw curtains FIRST (background layer)
          topCurtain.draw();
          bottomCurtain.draw();

          // Draw text LAST (foreground layer - always visible on top)
          shadeBar.draw();

          // Continue until all components inactive (synchronized completion)
          const anyActive = topCurtain.active || bottomCurtain.active || shadeBar.active;
          if (anyActive) {
            requestAnimationFrame(animate);
          } else {
            console.log('[Shade] Animation complete, cleaning up');
            lifecycle.cleanup(); // AnimationLifecycle cleanup
          }
        }

        // Start animation loop
        requestAnimationFrame(animate);
      });
    </script>
  </body>
</html>
