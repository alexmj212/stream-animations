<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Animation</title>
    <link rel="stylesheet" href="../shared/fonts/jost.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        position: relative;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #textOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 2;
      }

      /* ?debug=zones: where Mix It Up draws its images, above the text the
         way OBS stacks them */
      .miuZone {
        position: absolute;
        z-index: 3;
        background: rgba(255, 0, 170, 0.35);
        outline: 2px solid #ff00aa;
        font: bold 14px Arial, sans-serif;
        color: white;
        padding: 4px;
        pointer-events: none;
      }

      /* The alert text: placed and moved by the script (fitSidebarText,
         textOffsetAt), sized and stroked from config.design.type */
      #sidebarText {
        position: absolute;
        top: 0;
        left: 0;
        font-family: "Jost", Arial, sans-serif;
        font-weight: 700;
        color: white;
        text-align: right;
        white-space: nowrap;
        /* The TYPE-3 stroke sits under the fill, so it only widens the
           letters outward */
        paint-order: stroke fill;
        transform: translateX(200vw); /* Off screen until the first frame */
        will-change: transform;
      }

      #sidebarText .line {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="textOverlay">
      <div id="sidebarText"></div>
    </div>

    <script type="module">
      import { getColorFromURL, hexToHSL } from "../shared/colors.js";
      import { paletteFromURL } from "../shared/palette.js";
      import { setupCanvas, clearCanvas } from "../shared/canvas.js";
      import { SidebarBar, planSidebar, planSidebarTimeline } from "./SidebarBar.js";
      import { PerformanceMonitor } from "../shared/performance.js";
      import { PerformanceStorage } from "../shared/perfStorage.js";
      import { PerformanceOverlay } from "../shared/perfOverlay.js";
      import { AnimationLifecycle } from "../shared/lifecycle.js";
      import { DirtyRectTracker } from "../shared/dirtyRect.js";
      import { config } from "../config/config.js";
      import { registerProbe, sampleBar, createRandom, seedFromURL } from "../shared/motion.js";
      import { createDebug } from "../shared/debug.js";
      import { miuItemRect, coveredFraction } from "../shared/layout.js";
      import { cubicBezier, textOffsetAt, fitSidebarText, strokeWidthPx } from "../shared/animations/alertText.js";
      const debug = createDebug('sidebar');

      // Get parameters from URL
      const urlParams = new URLSearchParams(window.location.search);
      const text = urlParams.get("text") || "Sidebar Text";
      // A minimum total: the hold grows to the text's reading time (design audit #35)
      const durationMs = parseInt(urlParams.get("duration")) || config.sidebar.timing.defaultDurationMs;
      const showPerf = urlParams.get("perf") === "true";
      const baseColor = getColorFromURL();
      const baseHSL = hexToHSL(baseColor);
      // ?scheme= / ?colormode=: the epcot palette layout (null stops = single hue)
      const palette = paletteFromURL();
      debug.mark('palette', { scheme: palette.scheme, hueShift: palette.hueShift, color: baseColor });

      const fullText = text.toUpperCase();
      const timeline = planSidebarTimeline(fullText, durationMs);
      debug.mark('timeline', { durationMs, totalMs: Math.round(timeline.total * 1000), stillMs: Math.round((timeline.exitStart - timeline.enterEnd) * 1000) });
      const easeEnter = cubicBezier(config.design.motion.ease.enter);
      const easeExit = cubicBezier(config.design.motion.ease.exit);
      const ink = config.design.color.ink;
      const inkRgb = [1, 3, 5].map(i => parseInt(ink.slice(i, i + 2), 16)).join(", ");

      // The text on its nameplate (design audit #34): the name at
      // `headline`, the action at `label`, right-aligned to title-safe and
      // centred at config.sidebar.text.centerY. Lines are laid out once (and
      // again when the font arrives); each frame only moves them.
      const textElement = document.getElementById("sidebarText");
      const layout = { holdLeft: 0, plate: null };
      function fitText() {
        const type = config.design.type;
        const cfg = config.sidebar.text;
        const W = window.innerWidth;
        const H = window.innerHeight;
        const s = W / config.design.canvas.width;
        const stroke = (px) => strokeWidthPx(px, type) * s;
        const lineStyle = (el, px) => {
          el.style.fontSize = `${px * s}px`;
          el.style.lineHeight = String(cfg.lineHeight);
          el.style.letterSpacing = `${type.trackingEm}em`;
          el.style.webkitTextStroke = `${2 * stroke(px)}px ${ink}`;
          const o = px * type.shadowOffsetEm * s;
          el.style.textShadow = `${o}px ${o}px ${px * type.shadowBlurEm * s}px rgba(${inkRgb}, ${type.shadowAlpha})`;
        };

        // Measure in the page's own text layout
        const probe = document.createElement("span");
        probe.className = "line";
        Object.assign(probe.style, { position: "absolute", visibility: "hidden", display: "inline-block" });
        textElement.appendChild(probe);
        const measure = (str, px) => {
          lineStyle(probe, px);
          probe.textContent = str;
          return probe.getBoundingClientRect().width / s;
        };
        const room = cfg.maxWidthPx - 2 * strokeWidthPx(type.sizes.headline, type);
        const lines = fitSidebarText(fullText, measure, room, {
          headline: type.sizes.headline, label: type.sizes.label, minPx: type.minPx, minScale: cfg.minScale
        });
        probe.remove();

        textElement.replaceChildren();
        lines.forEach((line, i) => {
          if (i > 0) textElement.append(" "); // Word count and copy see a space
          const el = document.createElement("span");
          el.className = `line ${line.role}`;
          el.textContent = line.text;
          lineStyle(el, line.px);
          textElement.appendChild(el);
        });
        // The block's own size is the smallest line's, which the harness reads
        textElement.style.fontSize = `${Math.min(...lines.map(l => l.px)) * s}px`;

        // Hold position: the ink's right edge on title-safe
        const safeRight = W * (1 - config.design.safe.titleInset) - stroke(type.sizes.headline);
        textElement.style.transform = "none";
        const r = textElement.getBoundingClientRect();
        layout.holdLeft = Math.round(safeRight - r.width);
        layout.top = Math.round(cfg.centerY * H - r.height / 2);
        textElement.style.left = `${layout.holdLeft}px`;
        textElement.style.top = `${layout.top}px`;

        // The nameplate: a 15° parallelogram (GEO-1) of ink round the block,
        // its lower left corner further out, bleeding off the right edge
        const p = cfg.plate;
        const y0 = layout.top - p.padYPx * s;
        const h = r.height + 2 * p.padYPx * s;
        const slant = h * Math.tan(config.sidebar.slanted.angle * Math.PI / 180);
        const topLeft = layout.holdLeft - p.padXPx * s;
        layout.plate = { y: y0, h, topLeft, bottomLeft: topLeft - slant, right: W + p.bleedPx * s };
        // Off screen to the right before and after: past the plate's lower left corner
        layout.inPx = W - layout.plate.bottomLeft;
        layout.outPx = layout.inPx;
        textElement.style.transform = `translateX(${layout.inPx}px)`;
        debug.mark("textFit", { lines: lines.map(l => `${l.role}:${Math.round(l.px)}`).join(" "), left: layout.holdLeft, width: Math.round(r.width) });
      }
      fitText();

      /** Offset of the text and its plate from the hold position at t (s). */
      const offsetAt = (t) => textOffsetAt(timeline, layout.inPx, layout.outPx, easeEnter, easeExit, t);

      function drawPlate(offset) {
        const p = layout.plate;
        if (!p || p.bottomLeft + offset >= canvas.width) return;
        ctx.fillStyle = `rgba(${inkRgb}, ${config.sidebar.text.plate.alpha})`;
        ctx.beginPath();
        ctx.moveTo(p.topLeft + offset, p.y);
        ctx.lineTo(p.right + offset, p.y);
        ctx.lineTo(p.right + offset, p.y + p.h);
        ctx.lineTo(p.bottomLeft + offset, p.y + p.h);
        ctx.closePath();
        ctx.fill();
      }

      // Setup performance monitoring
      const perfMonitor = new PerformanceMonitor(60, 60);
      let perfOverlay = null;

      if (showPerf) {
        const perfStorage = new PerformanceStorage(50);
        perfOverlay = new PerformanceOverlay(perfMonitor, perfStorage, {
          position: 'top-right',
          opacity: 0.9,
          scene: 'sidebar'
        });

        perfMonitor.enable();
        perfOverlay.setupHotkey();
        perfOverlay.startSession();
        perfOverlay.show();
        perfOverlay.exposeAPI();
      }

      // Canvas setup
      const canvas = document.getElementById("canvas");
      const ctx = setupCanvas(canvas, { alpha: true });

      // Initialize dirty rectangle tracker (if enabled)
      const dirtyRectanglesEnabled = config.performance.dirtyRectangles.enabled;
      const visualize = config.performance.dirtyRectangles.visualize && showPerf; // Only visualize in perf mode

      let dirtyTracker = null;
      if (dirtyRectanglesEnabled) {
        dirtyTracker = new DirtyRectTracker(
          config.performance.dirtyRectangles.safetyMargin,
          visualize
        );
        dirtyTracker.setCanvas(canvas, ctx);
      }

      // Initialize lifecycle
      const lifecycle = new AnimationLifecycle();

      lifecycle.onCleanup(() => {
        if (SidebarBar.cacheCleanupInterval) {
          clearInterval(SidebarBar.cacheCleanupInterval);
          SidebarBar.cacheCleanupInterval = null;
        }
        console.log('[Sidebar] Cleanup complete');
      });

      // Background panel + balanced accents. ?seed=N pins the layout.
      const seed = seedFromURL() ?? Math.floor(Math.random() * 2 ** 31);
      const bars = planSidebar(ctx, canvas, baseHSL, timeline, createRandom(seed), palette.stops);
      bars.forEach((bar) => { bar.probeId = bar.isBackground ? 'background' : `${bar.type}-${bar.index}`; });
      registerProbe('sidebar', () => bars.filter(b => b.active).map(b => sampleBar(b, b.probeId)));

      // Mix It Up images drawn over this scene (config.sidebar.miuZones).
      // The harness fails if any of them covers the text.
      const miuZones = () => config.sidebar.miuZones.items.map(item => ({
        label: item.label,
        ...miuItemRect(item, window.innerWidth, window.innerHeight, config.sidebar.miuZones.pad)
      }));
      registerProbe('sidebar', () => {
        const r = textElement.getBoundingClientRect();
        const rect = { x: r.left, y: r.top, width: r.width, height: r.height };
        const onscreen = r.right > 0 && r.left < window.innerWidth;
        return [{ id: 'text', x: r.left, y: r.top, onscreen, miuCover: onscreen ? coveredFraction(rect, miuZones()) : 0 }];
      });
      // The plate's position in the bar probe tracks, for the velocity check
      registerProbe('sidebar', () => {
        const t = startTimestamp === null ? 0 : lastElapsed;
        return t < timeline.exitEnd ? [{ id: 'plate', x: layout.holdLeft + offsetAt(t), y: layout.top }] : [];
      });
      if (debug.on('zones')) {
        for (const z of miuZones()) {
          const el = document.createElement('div');
          el.className = 'miuZone';
          el.textContent = z.label;
          Object.assign(el.style, { left: `${z.x}px`, top: `${z.y}px`, width: `${z.width}px`, height: `${z.height}px` });
          document.body.appendChild(el);
        }
      }

      // Save session on page unload
      window.addEventListener('beforeunload', () => {
        if (showPerf && perfOverlay) {
          perfOverlay.endSession();
        }
      });

      // Animation loop - one-shot animation on page load. Positions come from
      // absolute time since the first frame so the bars, the plate and the
      // text stay locked together even if frames are dropped.
      let startTimestamp = null;
      let lastElapsed = 0;
      function animate(timestamp) {
        if (showPerf) perfMonitor.recordFrame();
        debug.frame(timestamp);

        if (startTimestamp === null) {
          startTimestamp = timestamp;
          debug.mark('start', { bars: bars.length });
        }
        const elapsed = (timestamp - startTimestamp) / 1000;
        lastElapsed = elapsed;

        clearCanvas(ctx, canvas, dirtyTracker);

        let allComplete = true;
        for (let i = 0; i < bars.length; i++) {
          bars[i].setTime(elapsed);
          if (!bars[i].active) continue;
          allComplete = false;

          // Report dirty region before drawing
          if (dirtyTracker) {
            const bbox = bars[i].getBoundingBox();
            dirtyTracker.addRegion(bbox.x, bbox.y, bbox.width, bbox.height);
          }

          bars[i].draw();
        }

        // The nameplate over the bars, and the text over it, moving as one
        if (elapsed < timeline.exitEnd) {
          const offset = offsetAt(elapsed);
          drawPlate(offset);
          textElement.style.transform = `translateX(${offset}px)`;
          allComplete = false;
        } else {
          textElement.style.transform = `translateX(${layout.outPx}px)`;
        }

        // If animation is not complete, continue loop
        if (!allComplete) {
          requestAnimationFrame(animate);
        } else {
          console.log('[Sidebar] Animation complete - one-shot finished');
          debug.mark('end', { elapsedMs: Math.round(elapsed * 1000) });
        }
      }

      // Page Visibility API - reload when page becomes visible to get fresh animation
      document.addEventListener('visibilitychange', () => {
        debug.mark('visibilitychange', { hidden: document.hidden });
        if (!document.hidden) {
          console.log('[Sidebar] Page became visible - reloading for fresh animation');
          location.reload();
        }
      });

      // Start the one-shot animation once Jost has loaded, so a late font
      // can't re-lay the text and plate out mid-move (Code review, #58)
      (document.fonts?.ready ?? Promise.resolve()).then(() => {
        fitText();
        requestAnimationFrame(animate);
      });
    </script>
  </body>
</html>
