<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        position: relative;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #textOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 2;
      }

      #sidebarText {
        position: absolute;
        top: 66.66%;
        right: -125%; /* Start off-screen to the right */
        transform: translateY(-50%); /* Center vertically */
        font-family: "Jost", Arial, sans-serif;
        font-size: 1.5vw; /* Scales with viewport width - 48px at 1920px */
        font-weight: bold;
        color: white;
        text-shadow: -0.15625vw -0.15625vw 0 #000, 0 -0.15625vw 0 #000, 0.15625vw -0.15625vw 0 #000, -0.15625vw 0 0 #000, 0.15625vw 0 0 #000, -0.15625vw 0.15625vw 0 #000, 0 0.15625vw 0 #000, 0.15625vw 0.15625vw 0 #000,
          0.208vw 0.208vw 0 rgba(0, 0, 0, 0.6), 0.26vw 0.26vw 0 rgba(0, 0, 0, 0.4), 0.3125vw 0.3125vw 0 rgba(0, 0, 0, 0.2);
        max-width: 38vw; /* Cap width so long strings can't bleed past the safe area */
        text-align: right;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        animation: slideText var(--duration) cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      /* Hold position: text-shadow needs ~10px breathing room past the rightmost
         glyph, so we anchor 2.6vw (~50px @ 1920) inside the canvas right edge. */
      @keyframes slideText {
        0% {
          right: -125%;
        }
        25% {
          right: 2.6vw;
        }
        75% {
          right: 2.6vw;
        }
        100% {
          right: -125%;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="textOverlay">
      <div id="sidebarText"></div>
    </div>

    <script type="module">
      import { getColorFromURL, hexToHSL } from "../shared/colors.js";
      import { setupCanvas, clearCanvas } from "../shared/canvas.js";
      import { SidebarBar } from "./SidebarBar.js";
      import { PerformanceMonitor } from "../shared/performance.js";
      import { PerformanceStorage } from "../shared/perfStorage.js";
      import { PerformanceOverlay } from "../shared/perfOverlay.js";
      import { DeltaTimer } from "../shared/timing.js";
      import { AnimationLifecycle } from "../shared/lifecycle.js";
      import { DirtyRectTracker } from "../shared/dirtyRect.js";
      import { config } from "../config/config.js";

      // Get parameters from URL
      const urlParams = new URLSearchParams(window.location.search);
      const text = urlParams.get("text") || "Sidebar Text";
      const durationMs = parseInt(urlParams.get("duration")) || config.sidebar.timing.defaultDurationMs;
      const showPerf = urlParams.get("perf") === "true";
      const baseColor = getColorFromURL();
      const baseHSL = hexToHSL(baseColor);

      // Setup text element
      const textElement = document.getElementById("sidebarText");
      textElement.textContent = text.toUpperCase();
      textElement.style.setProperty("--duration", `${durationMs}ms`);

      // Setup performance monitoring
      const perfMonitor = new PerformanceMonitor(60, 60);
      let perfOverlay = null;

      if (showPerf) {
        const perfStorage = new PerformanceStorage(50);
        perfOverlay = new PerformanceOverlay(perfMonitor, perfStorage, {
          position: 'top-right',
          opacity: 0.9,
          scene: 'sidebar'
        });

        perfMonitor.enable();
        perfOverlay.setupHotkey();
        perfOverlay.startSession();
        perfOverlay.show();
        perfOverlay.exposeAPI();
      }

      // Canvas setup
      const canvas = document.getElementById("canvas");
      const ctx = setupCanvas(canvas, { alpha: true });

      // Initialize dirty rectangle tracker (if enabled)
      const dirtyRectanglesEnabled = config.performance.dirtyRectangles.enabled;
      const visualize = config.performance.dirtyRectangles.visualize && showPerf; // Only visualize in perf mode

      let dirtyTracker = null;
      if (dirtyRectanglesEnabled) {
        dirtyTracker = new DirtyRectTracker(
          config.performance.dirtyRectangles.safetyMargin,
          visualize
        );
        dirtyTracker.setCanvas(canvas, ctx);
      }

      // Initialize delta-time and lifecycle
      const deltaTimer = new DeltaTimer();
      const lifecycle = new AnimationLifecycle();

      lifecycle.onCleanup(() => {
        if (SidebarBar.cacheCleanupInterval) {
          clearInterval(SidebarBar.cacheCleanupInterval);
          SidebarBar.cacheCleanupInterval = null;
        }
        console.log('[Sidebar] Cleanup complete');
      });

      // Create bars for sidebar
      const bars = [];

      // First, create large vertical background bar (75vw minimum to prevent background exposure)
      const backgroundBar = new SidebarBar(ctx, canvas, "slanted", 0, 1, baseHSL, durationMs);
      backgroundBar.width = canvas.width * 0.75; // 75% of viewport width
      backgroundBar.opacity = 1.0;
      backgroundBar.startX = canvas.width + 300;
      backgroundBar.targetX = canvas.width * 0.8; // Position at 80% mark (right 20% of screen)
      backgroundBar.x = backgroundBar.startX;
      backgroundBar.startDelay = 0;
      backgroundBar.isBackground = true;
      backgroundBar.hue = baseHSL.h;
      backgroundBar.saturation = baseHSL.s;
      backgroundBar.lightness = Math.max(15, baseHSL.l - 25);
      backgroundBar.isWhite = false;
      backgroundBar.zIndex = -1; // Draw behind everything
      bars.push(backgroundBar);

      // Create accent bars - use config.sidebar.bars.accent
      for (let i = 0; i < config.sidebar.bars.accent; i++) {
        // Mix of slanted and horizontal bars
        const type = Math.random() > 0.6 ? "slanted" : "horizontal";
        bars.push(new SidebarBar(ctx, canvas, type, i + 2, config.sidebar.bars.accent + 2, baseHSL, durationMs));
      }

      // Ensure at least 2 white bars exist (exclude background bar and text bar with z-index 999)
      const whiteBarCount = bars.filter((bar) => bar.isWhite).length;
      if (whiteBarCount < 2) {
        const nonWhiteBars = bars.filter((bar) => !bar.isWhite && bar.zIndex !== -1 && bar.zIndex !== 999);
        const barsToConvert = Math.min(2 - whiteBarCount, nonWhiteBars.length);
        for (let i = 0; i < barsToConvert; i++) {
          const randomIndex = Math.floor(Math.random() * nonWhiteBars.length);
          const barToConvert = nonWhiteBars.splice(randomIndex, 1)[0];
          barToConvert.isWhite = true;
          barToConvert.hue = 0;
          barToConvert.saturation = 0;
          barToConvert.lightness = 100;
          if (barToConvert.type === "slanted") {
            barToConvert.width = Math.random() * 80 + 40;
          } else {
            barToConvert.height = Math.random() * 30 + 20;
          }
        }
      }

      // Assign random z-index for weave effect (except bars with preset z-index)
      bars.forEach((bar) => {
        // Only randomize if z-index hasn't been explicitly set (background bar = -1, text bar = 999)
        if (bar.zIndex !== -1 && bar.zIndex !== 999) {
          bar.zIndex = Math.random();
        }
      });

      // Sort bars by zIndex
      bars.sort((a, b) => a.zIndex - b.zIndex);

      // Save session on page unload
      window.addEventListener('beforeunload', () => {
        if (showPerf && perfOverlay) {
          perfOverlay.endSession();
        }
      });

      // Animation loop - one-shot animation on page load
      function animate(timestamp) {
        if (showPerf) perfMonitor.recordFrame();

        const deltaTime = deltaTimer.update(timestamp);

        clearCanvas(ctx, canvas, dirtyTracker);

        let allComplete = true;
        for (let i = 0; i < bars.length; i++) {
          bars[i].update(deltaTime);

          // Report dirty region before drawing
          if (dirtyTracker && bars[i].active) {
            const bbox = bars[i].getBoundingBox();
            dirtyTracker.addRegion(bbox.x, bbox.y, bbox.width, bbox.height);
          }

          bars[i].draw();
          if (bars[i].active) {
            allComplete = false;
          }
        }

        // If animation is not complete, continue loop
        if (!allComplete) {
          requestAnimationFrame(animate);
        } else {
          console.log('[Sidebar] Animation complete - one-shot finished');
        }
      }

      // Page Visibility API - reload when page becomes visible to get fresh animation
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          console.log('[Sidebar] Page became visible - reloading for fresh animation');
          location.reload();
        }
      });

      // Start one-shot animation on page load
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
