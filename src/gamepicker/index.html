<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Picker</title>
    <style>
      :root {
        --bg: #1e1f29;
        --panel: #272935;
        --line: #3a3d4d;
        --text: #e8e8f0;
        --dim: #9a9cb0;
        --accent: #b00bee;
        --ok: #4fd18b;
        --bad: #ff6b6b;
        --green: #3ecf6e;
        --yellow: #e8d13a;
        --red: #ff4d4d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 8px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.35 system-ui, "Segoe UI", sans-serif;
      }
      body.busy { cursor: progress; }
      button, input { font: inherit; color: inherit; }
      button {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px 8px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      .status { color: var(--dim); font-size: 12px; }
      .status.ok { color: var(--ok); }
      .status.bad { color: var(--bad); }
      #auth { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 6px; }
      #auth small { flex-basis: 100%; color: var(--dim); }
      #auth[hidden] { display: none; }
      #auth input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px; }
      #showing { margin: 6px 0 4px; font-weight: 600; }
      #showing.missing { color: var(--bad); }
      .swap:disabled { opacity: 0.35; cursor: default; }
      #preview { display: block; width: 100%; border-radius: 4px; margin: 4px 0; background: #000; }
      #note { color: var(--yellow); min-height: 1em; margin: 4px 0; }
      .row { display: flex; gap: 6px; margin: 6px 0; }
      .row > * { flex: 1; }
      #search { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px; min-width: 0; }
      .opts { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 12px; }
      #windows { list-style: none; margin: 4px 0; padding: 0; }
      #windows li { display: flex; gap: 4px; margin: 3px 0; }
      #windows li.current .pick { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
      #windows li.empty { color: var(--dim); padding: 6px; }
      .pick { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; }
      .pick .exe { font-weight: 600; }
      .pick .title { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .swap { flex: none; width: 6.5em; font-size: 11px; color: var(--dim); }
      #meters { margin: 8px 0; }
      .meter { display: grid; grid-template-columns: 9em 1fr 3.5em; gap: 6px; align-items: center; font-size: 12px; margin: 2px 0; }
      .meter .track { height: 8px; background: var(--panel); border-radius: 4px; overflow: hidden; }
      .meter .bar { display: block; height: 100%; width: 0; background: var(--green); }
      .meter .bar[data-zone="yellow"] { background: var(--yellow); }
      .meter .bar[data-zone="red"] { background: var(--red); }
      .meter .mute { visibility: hidden; color: var(--bad); font-weight: 600; }
      .meter.muted .mute { visibility: visible; }
      .meter.missing { opacity: 0.4; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin: 10px 0 2px; }
    </style>
  </head>
  <body>
    <div id="status" class="status">Loading…</div>
    <form id="auth" hidden>
      <input id="password" type="password" placeholder="obs-websocket password" autocomplete="current-password">
      <button type="submit">Connect</button>
      <small>To skip this, end the dock URL with <code>?password=…</code></small>
    </form>

    <div id="showing">…</div>
    <img id="preview" alt="16:9 Game preview" hidden>
    <div id="note"></div>
    <div class="row">
      <button id="console" type="button">Console (capture card)</button>
      <button id="previewBtn" type="button">Check picture</button>
    </div>

    <h2>Audio</h2>
    <div id="meters"></div>

    <h2>Windows</h2>
    <div class="row">
      <input id="search" type="search" placeholder="Filter by game or title">
      <button id="refresh" type="button" style="flex: none">Refresh</button>
    </div>
    <div class="opts">
      <span>★ recent · click to capture</span>
      <label><input id="showAll" type="checkbox"> show all</label>
    </div>
    <ul id="windows"></ul>

    <script type="module" src="./main.js"></script>
  </body>
</html>
