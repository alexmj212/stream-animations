<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stinger Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="module">
        import { getColorFromURL, hexToHSL } from '../shared/colors.js';
        import { setupCanvas, clearCanvas } from '../shared/canvas.js';
        import { StingerBar } from './StingerBar.js';
        import { PerformanceMonitor } from '../shared/performance.js';
        import { PerformanceStorage } from '../shared/perfStorage.js';
        import { PerformanceOverlay } from '../shared/perfOverlay.js';
        import { DeltaTimer } from '../shared/timing.js';
        import { AnimationLifecycle } from '../shared/lifecycle.js';
        import { DirtyRectTracker } from '../shared/dirtyRect.js';
        import { config } from '../config/config.js';

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const durationMs = parseInt(urlParams.get('duration')) || config.stinger.timing.defaultDurationMs;
        const showPerf = urlParams.get('perf') === 'true';
        const baseColor = getColorFromURL();
        const baseHSL = hexToHSL(baseColor);

        // Setup performance monitoring
        const perfMonitor = new PerformanceMonitor(60, 60);
        let perfOverlay = null;

        if (showPerf) {
            const perfStorage = new PerformanceStorage(50);
            perfOverlay = new PerformanceOverlay(perfMonitor, perfStorage, {
                position: 'top-right',
                opacity: 0.9,
                scene: 'stinger'
            });

            perfMonitor.enable();
            perfOverlay.setupHotkey();
            perfOverlay.startSession();
            perfOverlay.show();
            perfOverlay.exposeAPI();
        }

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = setupCanvas(canvas, { alpha: true });

        // Initialize dirty rectangle tracker (if enabled)
        const dirtyRectanglesEnabled = config.performance.dirtyRectangles.enabled;
        const visualize = config.performance.dirtyRectangles.visualize && showPerf; // Only visualize in perf mode

        let dirtyTracker = null;
        if (dirtyRectanglesEnabled) {
            dirtyTracker = new DirtyRectTracker(
                config.performance.dirtyRectangles.safetyMargin,
                visualize
            );
            dirtyTracker.setCanvas(canvas, ctx);
        }

        // Initialize delta-time and lifecycle
        const deltaTimer = new DeltaTimer();
        const lifecycle = new AnimationLifecycle();

        lifecycle.onCleanup(() => {
            if (StingerBar.cacheCleanupInterval) {
                clearInterval(StingerBar.cacheCleanupInterval);
                StingerBar.cacheCleanupInterval = null;
            }
            console.log('[Stinger] Cleanup complete');
        });

        // Create bars array
        const bars = [];

        // Animation loop control
        let animationStarted = false;

        // Function to generate bars (called on each transitionStart)
        function generateBars() {
            bars.length = 0; // Clear existing bars

            // First, create two large background curtain bars
            const leftCurtain = new StingerBar(ctx, canvas, 'slanted', 0, 2, baseHSL, durationMs);
            leftCurtain.width = canvas.width * 0.75;
            leftCurtain.opacity = 1.0;
            leftCurtain.direction = 1;
            leftCurtain.startX = -leftCurtain.width - 300;
            leftCurtain.targetX = canvas.width / 2 - leftCurtain.width;
            leftCurtain.x = leftCurtain.startX;
            leftCurtain.startDelay = 0;
            leftCurtain.isBackground = true;
            leftCurtain.hue = baseHSL.h;
            leftCurtain.saturation = baseHSL.s;
            leftCurtain.lightness = Math.max(15, baseHSL.l - 25);
            leftCurtain.isWhite = false;
            bars.push(leftCurtain);

            const rightCurtain = new StingerBar(ctx, canvas, 'slanted', 1, 2, baseHSL, durationMs);
            rightCurtain.width = canvas.width * 0.75;
            rightCurtain.opacity = 1.0;
            rightCurtain.direction = -1;
            rightCurtain.startX = canvas.width + 300;
            rightCurtain.targetX = canvas.width / 2;
            rightCurtain.x = rightCurtain.startX;
            rightCurtain.startDelay = 0;
            rightCurtain.isBackground = true;
            rightCurtain.hue = baseHSL.h;
            rightCurtain.saturation = baseHSL.s;
            rightCurtain.lightness = Math.max(15, baseHSL.l - 25);
            rightCurtain.isWhite = false;
            bars.push(rightCurtain);

            // Add accent bars
            const barCount = 6;
            const tempBars = [];
            for (let i = 0; i < barCount; i++) {
                const type = Math.random() > 0.6 ? 'slanted' : 'horizontal';
                tempBars.push(new StingerBar(ctx, canvas, type, i + 2, barCount + 2, baseHSL, durationMs));
            }

            // Ensure at least 2 white bars exist
            const whiteBarCount = tempBars.filter(bar => bar.isWhite).length;
            if (whiteBarCount < 2) {
                const nonWhiteBars = tempBars.filter(bar => !bar.isWhite);
                const barsToConvert = Math.min(2 - whiteBarCount, nonWhiteBars.length);
                for (let i = 0; i < barsToConvert; i++) {
                    const randomIndex = Math.floor(Math.random() * nonWhiteBars.length);
                    const barToConvert = nonWhiteBars.splice(randomIndex, 1)[0];
                    barToConvert.isWhite = true;
                    barToConvert.hue = 0;
                    barToConvert.saturation = 0;
                    barToConvert.lightness = 100;
                    if (barToConvert.type === 'slanted') {
                        barToConvert.width = Math.random() * 80 + 40;
                    } else {
                        barToConvert.height = Math.random() * 30 + 20;
                    }
                }
            }

            // Assign random z-index for weave effect
            tempBars.forEach(bar => {
                bar.zIndex = Math.random();
            });

            bars.push(...tempBars);
        }

        // Save session on page unload
        window.addEventListener('beforeunload', () => {
            if (showPerf && perfOverlay) {
                perfOverlay.endSession();
            }
        });

        // Animation loop
        function animate(timestamp) {
            if (showPerf) perfMonitor.recordFrame();

            const deltaTime = deltaTimer.update(timestamp);

            clearCanvas(ctx, canvas, dirtyTracker);

            let allComplete = true;

            // Draw background curtain bars first
            const backgroundBars = bars.filter(bar => bar.isBackground);
            for (let i = 0; i < backgroundBars.length; i++) {
                backgroundBars[i].update(deltaTime);

                // Report dirty region before drawing
                if (dirtyTracker && backgroundBars[i].active) {
                    const bbox = backgroundBars[i].getBoundingBox();
                    dirtyTracker.addRegion(bbox.x, bbox.y, bbox.width, bbox.height);
                }

                backgroundBars[i].draw();
                if (backgroundBars[i].active) {
                    allComplete = false;
                }
            }

            // Sort accent bars by zIndex and draw
            const accentBars = bars.filter(bar => !bar.isBackground)
                .sort((a, b) => a.zIndex - b.zIndex);
            for (let i = 0; i < accentBars.length; i++) {
                accentBars[i].update(deltaTime);

                // Report dirty region before drawing
                if (dirtyTracker && accentBars[i].active) {
                    const bbox = accentBars[i].getBoundingBox();
                    dirtyTracker.addRegion(bbox.x, bbox.y, bbox.width, bbox.height);
                }

                accentBars[i].draw();
                if (accentBars[i].active) {
                    allComplete = false;
                }
            }

            if (!allComplete) {
                requestAnimationFrame(animate);
            } else {
                // Animation complete, reset state for next transition
                animationStarted = false;
            }
        }

        // Register transitionStart event listener IMMEDIATELY to catch first OBS scene change
        lifecycle.addEventListener(window, 'transitionStart', () => {
            console.log('[Stinger] transitionStart event received');

            // Regenerate bars for fresh animation
            generateBars();

            // Start animation if not already running
            if (!animationStarted) {
                animationStarted = true;
                deltaTimer.reset(); // Reset timer for fresh start
                requestAnimationFrame(animate);
            }
        });

        console.log('[Stinger] Initialized - waiting for transitionStart event');
    </script>
</body>
</html>
