<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stinger Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="module">
        import { getColorFromURL, hexToHSL } from '../shared/colors.js';
        import { setupCanvas, clearCanvas } from '../shared/canvas.js';
        import { StingerBar, planStinger } from './StingerBar.js';
        import { PerformanceMonitor } from '../shared/performance.js';
        import { PerformanceStorage } from '../shared/perfStorage.js';
        import { PerformanceOverlay } from '../shared/perfOverlay.js';
        import { AnimationLifecycle } from '../shared/lifecycle.js';
        import { DirtyRectTracker } from '../shared/dirtyRect.js';
        import { config } from '../config/config.js';
        import { registerProbe, sampleBar, createRandom, seedFromURL } from '../shared/motion.js';

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const durationMs = parseInt(urlParams.get('duration')) || config.stinger.timing.defaultDurationMs;
        const showPerf = urlParams.get('perf') === 'true';
        const baseColor = getColorFromURL();
        const baseHSL = hexToHSL(baseColor);

        // Setup performance monitoring
        const perfMonitor = new PerformanceMonitor(60, 60);
        let perfOverlay = null;

        if (showPerf) {
            const perfStorage = new PerformanceStorage(50);
            perfOverlay = new PerformanceOverlay(perfMonitor, perfStorage, {
                position: 'top-right',
                opacity: 0.9,
                scene: 'stinger'
            });

            perfMonitor.enable();
            perfOverlay.setupHotkey();
            perfOverlay.startSession();
            perfOverlay.show();
            perfOverlay.exposeAPI();
        }

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = setupCanvas(canvas, { alpha: true });

        // Initialize dirty rectangle tracker (if enabled)
        const dirtyRectanglesEnabled = config.performance.dirtyRectangles.enabled;
        const visualize = config.performance.dirtyRectangles.visualize && showPerf; // Only visualize in perf mode

        let dirtyTracker = null;
        if (dirtyRectanglesEnabled) {
            dirtyTracker = new DirtyRectTracker(
                config.performance.dirtyRectangles.safetyMargin,
                visualize
            );
            dirtyTracker.setCanvas(canvas, ctx);
        }

        const lifecycle = new AnimationLifecycle();

        lifecycle.onCleanup(() => {
            if (StingerBar.cacheCleanupInterval) {
                clearInterval(StingerBar.cacheCleanupInterval);
                StingerBar.cacheCleanupInterval = null;
            }
            console.log('[Stinger] Cleanup complete');
        });

        // Bars for the current transition (curtains first, accents by depth)
        let bars = [];
        let startTimestamp = null;
        let animationStarted = false;
        let transitionCount = 0;

        // ?seed=N pins the layout (same stinger every time, e.g. for video
        // export); without it every transition gets a fresh balanced layout.
        const pinnedSeed = seedFromURL();

        function generateBars() {
            const seed = pinnedSeed ?? Math.floor(Math.random() * 2 ** 31);
            transitionCount++;
            bars = planStinger(ctx, canvas, baseHSL, durationMs, createRandom(seed));
        }

        registerProbe('stinger', () => bars.filter(b => b.active).map((b, i) =>
            sampleBar(b, b.isBackground ? `curtain-${b.direction === 1 ? 'L' : 'R'}` : `${b.type}-${b.index}`)));

        // Save session on page unload
        window.addEventListener('beforeunload', () => {
            if (showPerf && perfOverlay) {
                perfOverlay.endSession();
            }
        });

        // Animation loop. Bars are positioned from absolute time since the
        // transition started (not accumulated deltas), so a dropped or slow
        // frame can never push the cut point or the end off schedule.
        function animate(timestamp) {
            if (showPerf) perfMonitor.recordFrame();

            if (startTimestamp === null) startTimestamp = timestamp;
            const elapsed = (timestamp - startTimestamp) / 1000;

            clearCanvas(ctx, canvas, dirtyTracker);

            let allComplete = true;
            for (let i = 0; i < bars.length; i++) {
                const bar = bars[i];
                bar.setTime(elapsed);
                if (!bar.active) continue;
                allComplete = false;

                if (dirtyTracker) {
                    const bbox = bar.getBoundingBox();
                    dirtyTracker.addRegion(bbox.x, bbox.y, bbox.width, bbox.height);
                }
                bar.draw();
            }

            if (!allComplete) {
                requestAnimationFrame(animate);
            } else {
                // Animation complete, reset state for next transition
                animationStarted = false;
            }
        }

        function play(source) {
            console.log(`[Stinger] ${source} - starting transition`);
            generateBars();
            startTimestamp = null; // restart the clock on the next frame
            if (!animationStarted) {
                animationStarted = true;
                requestAnimationFrame(animate);
            }
        }

        // Register listeners IMMEDIATELY to catch the first scene change.
        // transitionStart: dispatched by the OBS setup driving this page.
        lifecycle.addEventListener(window, 'transitionStart', () => play('transitionStart'));
        // obsSourceActiveChanged: OBS browser sources fire this when the source
        // goes live (e.g. the stinger lives in a scene that is switched to).
        lifecycle.addEventListener(window, 'obsSourceActiveChanged', (event) => {
            if (event.detail?.active) play('obsSourceActiveChanged');
        });
        // ?autoplay=true plays once on load (previewing, recording)
        if (urlParams.get('autoplay') === 'true') play('autoplay');

        console.log('[Stinger] Initialized - waiting for transitionStart event');
    </script>
</body>
</html>
