<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title Card</title>
    <link rel="stylesheet" href="../shared/fonts/jost.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script type="module">
      import { setupCanvas, clearCanvas } from "../shared/canvas.js";
      import { TitleCard } from "./TitleCard.js";
      import { AnimationLifecycle } from "../shared/lifecycle.js";
      import { config } from "../config/config.js";
      import { registerProbe } from "../shared/motion.js";
      import { createDebug } from "../shared/debug.js";
      const debug = createDebug('title');

      // ?text= is the title (WELCOME, BRB, ENDING). The card slides in once
      // when the source loads, then holds still: no frames while idle
      const urlParams = new URLSearchParams(window.location.search);
      const text = urlParams.get("text") || config.title.defaultText;

      const canvas = document.getElementById("canvas");
      const ctx = setupCanvas(canvas, { alpha: true });
      const lifecycle = new AnimationLifecycle();

      let card = null;
      let startMs = null;
      let frameQueued = false;
      function requestDraw() {
        if (frameQueued || !card) return;
        frameQueued = true;
        requestAnimationFrame(frame);
      }
      function frame(timestamp) {
        frameQueued = false;
        debug.frame(timestamp);
        if (startMs === null) startMs = timestamp;
        card.setTime(timestamp - startMs);
        clearCanvas(ctx, canvas);
        card.draw();
        if (!card.done) requestDraw();
        else debug.mark('idle', { text: card.text, fontPx: Math.round(card.fontPx) });
      }

      // Wait for Jost (bundled, TYPE-7) so the card is sized to the real font
      document.fonts.load(`${config.title.text.weight} ${config.title.text.sizePx}px ${config.title.text.font}`)
        .catch(() => {})
        .then(() => {
          card = new TitleCard(ctx, canvas, text);
          registerProbe('title', () => card.probeSamples());
          debug.mark('start', { text: card.text });
          requestDraw();
        });

      // A resize clears the canvas: rebuild sizes and repaint
      lifecycle.addEventListener(window, 'resize', () => {
        if (!card) return;
        card.build();
        requestDraw();
      });
    </script>
  </body>
</html>
